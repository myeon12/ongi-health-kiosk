<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>보건실 접수</title><style>:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#193745;background:#f2f7f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input{touch-action:manipulation}header{height:90px;display:flex;align-items:center;gap:28px;padding:0 5vw;border-bottom:1px solid #dce8eb;background:white}.brand{color:#193745;text-decoration:none;font-size:26px;font-weight:800}.brand b{background:#167b92;color:white;border-radius:14px;padding:7px 10px;margin-right:10px}.brand span{font-size:17px;color:#68808c;font-weight:400}#connection{margin-left:auto;font-size:14px;color:#487a68}.teacher-link{color:#6a808b;font-size:14px}main{max-width:1300px;margin:auto;padding:46px 4vw 100px}.layout{display:grid;grid-template-columns:310px 1fr;gap:58px}.eyebrow{color:#167b92;letter-spacing:2px;font-size:14px;font-weight:bold}h1{font-size:44px;line-height:1.25;letter-spacing:-2px;margin:20px 0}h2{font-size:24px}p{line-height:1.7;color:#647c88}.steps{display:flex;gap:8px;margin:30px 0}.step{background:#e2ecef;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#6b818a}.step.on{color:white;background:#177e96}.waiting{margin-top:45px;padding:23px;background:#e5eff2;border-radius:20px}.waiting strong{font-size:36px;color:#167b92}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.choice{border:1px solid #dae7eb;background:white;border-radius:22px;min-height:148px;cursor:pointer;color:#254a5a;box-shadow:0 4px 0 #e8eff1}.choice:hover{border-color:#188ba3;background:#f5fcff}.choice strong{font-size:49px;display:block}.choice small{font-size:18px;color:#6d8590}.numbers{grid-template-columns:repeat(5,1fr)}.numbers .choice{min-height:85px;border-radius:16px}.numbers .choice strong{font-size:29px}.symptoms{grid-template-columns:repeat(2,1fr)}.symptoms .choice{min-height:78px;padding:14px;font-size:20px;text-align:left}.choice.selected{border:2px solid #1686a0;background:#e3f5fa;color:#096a83}.actions{display:flex;gap:12px;margin-top:26px;justify-content:space-between}.primary,.secondary,.danger,.tab{border:0;border-radius:13px;padding:16px 24px;cursor:pointer;font-weight:bold}.primary{background:#167f98;color:white}.secondary{background:#e4edef;color:#385f70}.danger{background:#fff0ed;color:#ab4b37}button:disabled{opacity:.45;cursor:wait}.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.pill{padding:9px 15px;background:#e6f1f4;border-radius:10px}.success{text-align:center;background:white;border-radius:28px;padding:65px 25px}.check{display:grid;place-items:center;margin:auto;width:90px;height:90px;background:#def4ea;border-radius:50%;color:#23846c;font-size:48px}.success h1{font-size:43px}.success strong{color:#167b92}.login{max-width:470px;background:white;padding:36px;border-radius:24px;margin:30px auto}.login h1{font-size:34px}label{display:block;margin:20px 0 7px;color:#526f7d}input,select{width:100%;padding:14px;border:1px solid #cedfe5;border-radius:10px;background:white}input:focus{outline:2px solid #167b92}.error{color:#b34836;background:#fff1ec;padding:14px;border-radius:10px;margin:16px 0}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}.toolbar h1{margin-right:auto;font-size:36px}.stats{display:flex;gap:15px;margin-bottom:25px}.stat{background:white;border:1px solid #e0e9ec;border-radius:18px;padding:18px 25px;min-width:160px}.stat strong{font-size:32px;margin-left:18px;color:#147d95}.tabs{display:flex;gap:8px;margin-bottom:24px}.tab.active{background:#193f50;color:white}.tab{background:#e5edef;color:#567380}.card{background:white;border:1px solid #dce8ed;border-radius:18px;padding:22px;margin-bottom:14px;display:flex;align-items:center;gap:20px}.position{min-width:55px;text-align:center;color:#177d94;font-weight:bold;font-size:30px}.details{flex:1}.details h3{font-size:22px;margin:0 0 8px}.details p{margin:0;font-size:16px}.card-actions{display:flex;gap:8px;flex-wrap:wrap}.card-actions button{padding:12px 16px}.empty{text-align:center;padding:60px;color:#7b919a;background:white;border-radius:20px}.notice{background:#fff4db;color:#7b631f;padding:15px 20px;border-radius:13px;margin-bottom:22px;line-height:1.6}.settings{background:white;padding:25px;border-radius:20px;max-width:550px}footer{position:fixed;bottom:0;left:0;right:0;padding:17px;background:#fff9ec;color:#886432;text-align:center;font-size:17px;border-top:1px solid #f0e5cd}#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#163f50;color:white;padding:15px 25px;border-radius:12px;display:none;z-index:10}button:focus-visible,a:focus-visible{outline:3px solid #f4b547;outline-offset:4px}@media(max-width:850px){header{padding:0 20px;gap:12px}.layout{grid-template-columns:1fr;gap:20px}h1{font-size:34px}.steps{margin:15px 0}.waiting{margin-top:15px;padding:12px;display:inline-block}.waiting strong{font-size:25px}.choice{min-height:100px}.card{align-items:flex-start;flex-wrap:wrap}.card-actions{width:100%;justify-content:flex-end}.brand span{display:none}}@media(max-width:480px){main{padding:25px 18px 100px}.grid{gap:9px}.numbers{grid-template-columns:repeat(4,1fr)}.symptoms .choice{font-size:17px}.choice strong{font-size:36px}#connection{font-size:11px}.teacher-link{font-size:12px}.stat{min-width:0;padding:15px}.stat strong{margin-left:7px}footer{font-size:13px}}
dialog.reason-editor{width:min(560px,calc(100vw - 32px));max-height:85vh;overflow:auto;border:1px solid #dce8ed;border-radius:22px;padding:28px;color:#193745}dialog.reason-editor::backdrop{background:#19374588}.reason-editor textarea{width:100%;font:inherit;padding:14px;border:1px solid #cedfe5;border-radius:10px;resize:vertical}.reason-editor textarea:focus{outline:2px solid #167b92}</style></head><body><header><a href="#" class="brand"><b>＋</b> 보건실 접수</a><div id="connection">연결 확인 중</div><a href="#teacher" class="teacher-link">선생님 관리</a></header><main id="app"></main><div id="toast" role="status"></div><footer>급하거나 많이 아프면 접수보다 먼저 선생님께 말해요.</footer><script>'use strict';
const root=document.getElementById('app'),connection=document.getElementById('connection');
const teacherPage=location.hash==='#teacher';
let session,config={waiting:null,symptoms:[],maxNumber:30},step=0,chosen={grade:null,room:null,num:null,symptoms:[]},requestId=crypto.randomUUID(),busy=false,completed=false,lastInput=Date.now(),visits=[],tab='active',settings={},undo=null;
const statusLabel={waiting:'대기',treating:'진료중',done:'완료',cancelled:'취소'};
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const button=(text,cls,fn)=>{const b=el('button',cls,text);b.type='button';b.addEventListener('click',()=>{lastInput=Date.now();fn()});return b};
function notify(t){const n=document.getElementById('toast');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',4500)}
let apiToken='';sessionStorage.removeItem('ongi-token');
async function api(path,data){
 const op=path.split('/').pop();
 if(op==='session'&&apiToken&&session){return session;}
 const res=await fetch('https://kzbkuapvtahtzibcqiwp.supabase.co/functions/v1/kiosk-api',{method:'POST',headers:{'Content-Type':'application/json','x-kiosk-session':apiToken},body:JSON.stringify({op,payload:data||{}})});
 const out=await res.json();
 if(!res.ok){if(res.status===401){apiToken='';sessionStorage.removeItem('ongi-token');}throw new Error(out.error||'연결을 확인해 주세요.');}
 if(out.token){apiToken=out.token;sessionStorage.setItem('ongi-token',apiToken);session=out;}
 if(op==='logout'){apiToken='';sessionStorage.removeItem('ongi-token');session=null;}
 return out;
}
async function refreshPublic(){try{config=await api('/api/public');connection.textContent='● 연결됨';const w=document.getElementById('count');if(w)w.textContent=config.waiting}catch{connection.textContent='● 연결 끊김';const w=document.getElementById('count');if(w)w.textContent='확인 중'}}
function reset(){chosen={grade:null,room:null,num:null,symptoms:[]};step=0;busy=false;completed=false;requestId=crypto.randomUUID();lastInput=Date.now();renderStudent()}
function errorBox(e){return el('div','error',e.message||e)}
function renderStudent(){root.replaceChildren();const layout=el('div','layout'),aside=el('section'),body=el('section');aside.append(el('div','eyebrow','HEALTH ROOM · CHECK IN'),el('h1','',['몇 학년이에요?','몇 반이에요?','몇 번이에요?','어디가 불편해요?'][step]),el('p','','천천히 눌러 주세요.\n잘못 눌렀다면 돌아갈 수 있어요.'));const steps=el('div','steps');for(let i=0;i<4;i++)steps.append(el('span','step'+(step===i?' on':''),i+1));aside.append(steps);const w=el('div','waiting');w.append(el('span','','지금 기다리는 친구 '));const count=el('strong','',config.waiting??'확인 중');count.id='count';w.append(count,el('span','',' 명'));aside.append(w);const summary=el('div','summary');['grade','room','num'].forEach((k,i)=>{if(chosen[k])summary.append(el('span','pill',chosen[k]+['학년','반','번'][i]))});body.append(summary);const grid=el('div','grid'+(step===2?' numbers':step===3?' symptoms':''));if(step<3){const max=[6,9,config.maxNumber][step];for(let n=1;n<=max;n++){const b=button('','choice',()=>{chosen[['grade','room','num'][step]]=n;if(step===0){chosen.room=null;chosen.num=null}if(step===1)chosen.num=null;step++;renderStudent()});b.append(el('strong','',n),el('small','',['학년','반','번'][step]));grid.append(b)}}else config.symptoms.forEach(s=>{const b=button((chosen.symptoms.includes(s)?'✓  ':'')+s,'choice'+(chosen.symptoms.includes(s)?' selected':''),()=>{chosen.symptoms=chosen.symptoms.includes(s)?chosen.symptoms.filter(x=>x!==s):[...chosen.symptoms,s];renderStudent()});b.setAttribute('aria-pressed',chosen.symptoms.includes(s));grid.append(b)});body.append(grid);const actions=el('div','actions');actions.append(button(step?'← 이전으로':'처음으로','secondary',()=>{if(step)step--;else reset();renderStudent()}));if(step===3){const b=button(busy?'저장 확인 중…':'접수하기 →','primary',submit);b.disabled=busy||!chosen.symptoms.length;actions.append(b)}body.append(actions);layout.append(aside,body);root.append(layout)}
async function submit(){if(busy)return;busy=true;renderStudent();try{const out=await api('/api/checkin',{...chosen,id:requestId});completed=true;chosen={grade:null,room:null,num:null,symptoms:[]};root.replaceChildren();const panel=el('div','success');panel.append(el('div','check','✓'),el('h1','','접수됐어요!'),el('h2','',`지금은 대기 ${out.position}번째예요.`),el('p','','의자에 앉아서 기다려 주세요.\n선생님이 부르면 들어오세요.'),button('처음 화면으로','primary',reset),el('p','','5초 후 첫 화면으로 돌아가요.'));root.append(panel);await refreshPublic();setTimeout(()=>{if(completed)reset()},5000)}catch(e){busy=false;renderStudent();root.prepend(errorBox(e))}}
function login(){root.replaceChildren();visits=[];const box=el('form','login');box.append(el('div','eyebrow','TEACHER ACCESS'),el('h1','','선생님 관리창'),el('p','','선생님 계정으로 로그인해 주세요.'));const fields=[['아이디','username','text'],['계정 비밀번호','password','password'],['관리창 비밀번호','pin','password']];for(const [name,key,type]of fields){const label=el('label','',name),input=el('input');input.name=key;input.id=key;label.htmlFor=key;input.type=type;input.required=true;input.autocomplete=key==='username'?'username':key==='password'?'current-password':'off';if(key==='username')input.value='teacher';if(key==='pin'){input.inputMode='numeric';input.maxLength=4}box.append(label,input)}const submit=el('button','primary','관리창 열기');submit.type='submit';submit.style.marginTop='24px';box.append(submit);box.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;box.querySelector('.error')?.remove();try{const d=Object.fromEntries(new FormData(box));await api('/api/login',d);session=await api('/api/session');await loadTeacher()}catch(err){box.append(errorBox(err))}finally{submit.disabled=false}});root.append(box)}
async function loadTeacher(){try{const d=await api('/api/visits');visits=d.visits;settings=d.settings;connection.textContent='● 연결됨 · '+new Date().toLocaleTimeString('ko-KR');renderTeacher()}catch(e){connection.textContent='● 연결 끊김 / 인증 확인 필요';if(e.message.includes('인증')||e.message.includes('잠금'))login();else notify(e.message)}}
async function change(v,status){try{await api('/api/status',{id:v.id,status,version:v.version});if(status==='done'){undo={id:v.id,version:v.version+1,until:Date.now()+10000};notify('완료했어요. 상단에서 10초간 실행 취소할 수 있어요.')}await loadTeacher()}catch(e){notify(e.message);await loadTeacher()}}

function editReason(v){
 if(document.querySelector('dialog.reason-editor'))return;
 const dialog=el('dialog','reason-editor'),form=el('form'),title=el('h2','','방문 사유 수정');
 title.id='reason-title';dialog.setAttribute('aria-labelledby',title.id);
 form.append(title,el('p','',v.grade+'학년 '+v.room+'반 '+v.num+'번 · '+statusLabel[v.status]));
 const label=el('label','','사유를 한 줄에 하나씩 입력해 주세요.'),input=el('textarea');
 input.id='reason-input';label.htmlFor=input.id;input.rows=5;input.maxLength=2411;input.value=v.symptoms.join('\n');
 form.append(label,input,el('p','','1~12개, 사유마다 200자까지 입력할 수 있어요. 저장 후 CSV에도 반영돼요.'));
 const actions=el('div','actions'),cancel=button('취소','secondary',()=>dialog.close()),save=el('button','primary','저장');
 save.type='submit';actions.append(cancel,save);form.append(actions);
 form.addEventListener('input',()=>{lastInput=Date.now()});
 form.addEventListener('submit',async e=>{
  e.preventDefault();if(save.disabled)return;
  const symptoms=input.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  form.querySelector('.error')?.remove();
  if(!symptoms.length||symptoms.length>12||symptoms.some(x=>x.length>200)){form.append(errorBox('사유는 1~12개, 각 200자 이내로 입력해 주세요.'));return}
  save.disabled=true;cancel.disabled=true;input.disabled=true;save.textContent='저장 중…';
  try{await api('/api/reason',{id:v.id,version:v.version,symptoms});dialog.close();notify('방문 사유를 수정했어요. 새로 내려받는 CSV에도 반영돼요.');await loadTeacher()}
  catch(e){form.append(errorBox(e));}
  finally{save.disabled=false;cancel.disabled=false;input.disabled=false;save.textContent='저장'}
 });
 dialog.addEventListener('cancel',e=>{if(save.disabled)e.preventDefault()});
 dialog.addEventListener('close',()=>dialog.remove());dialog.append(form);document.body.append(dialog);dialog.showModal();input.focus();
}

function renderTeacher(){if(document.querySelector('dialog.reason-editor'))return;if(tab==='settings'&&root.querySelector('form.settings'))return;root.replaceChildren();const tools=el('div','toolbar');tools.append(el('h1','','보건실 접수 관리'),button('새로고침','secondary',loadTeacher),button('로그아웃','secondary',async()=>{await api('/api/logout',{});session=await api('/api/session');login()}));root.append(tools);if(settings.retention_days==='0')root.append(el('div','notice','시제품 · 보관 기간이 아직 설정되지 않았어요. 실제 학생 정보는 입력하지 마세요.'));const stats=el('div','stats');for(const [s,name]of[['waiting','대기'],['treating','진료중']]){const n=el('div','stat',name);n.append(el('strong','',visits.filter(v=>v.status===s).length));stats.append(n)}root.append(stats);const tabs=el('div','tabs');[['active','현재 접수'],['history','완료·취소 내역'],['settings','운영 설정']].forEach(([key,name])=>tabs.append(button(name,'tab'+(tab===key?' active':''),()=>{tab=key;root.replaceChildren();renderTeacher()})));root.append(tabs);if(undo&&undo.until>Date.now())root.append(button('↶ 방금 완료한 접수 되돌리기','secondary',async()=>{const u=undo;undo=null;await change(u,'treating')}));if(tab==='settings'){renderSettings();return}const filtered=tab==='active'?[...visits.filter(v=>v.status==='treating'),...visits.filter(v=>v.status==='waiting')]:visits.filter(v=>['done','cancelled'].includes(v.status)).reverse();if(!filtered.length)root.append(el('div','empty',tab==='active'?'지금 접수된 학생이 없어요.':'완료·취소 내역이 없어요.'));for(const v of filtered){const card=el('article','card');card.append(el('div','position',v.status==='waiting'?v.position:'＋'));const details=el('div','details');details.append(el('h3','',`${v.grade}학년 ${v.room}반 ${v.num}번`),el('p','',v.symptoms.join(' · ')),el('p','',`${statusLabel[v.status]} · ${new Date(v.created).toLocaleString('ko-KR')}`));card.append(details);const a=el('div','card-actions');a.append(button('사유 수정','secondary',()=>editReason(v)));if(v.status==='waiting'){a.append(button('진료 시작','primary',()=>change(v,'treating')),button('접수 취소','danger',()=>{if(confirm('이 접수를 취소할까요? 기록은 취소 내역에 남아요.'))change(v,'cancelled')}))}else if(v.status==='treating'){a.append(button('완료 ✓','primary',()=>change(v,'done')),button('대기로','secondary',()=>change(v,'waiting')))}else a.append(button('대기로 복원','secondary',()=>{if(confirm('원래 접수순서로 복원할까요?'))change(v,'waiting')}));card.append(a);root.append(card)}}
function renderSettings(){const f=el('form','settings');f.append(el('h2','','운영 설정'),el('p','','번호 범위는 현재 전체 학급 공통이에요.\n보관 기간 0일은 자동 삭제 미설정 상태입니다.'));for(const [key,label,value,min,max]of[['maxNumber','학생 번호 최대값',settings.max_number,1,60],['retentionDays','완료·취소 기록 보관 일수',settings.retention_days,0,3650]]){const l=el('label','',label),i=el('input');i.name=key;i.type='number';i.min=min;i.max=max;i.value=value;i.required=true;f.append(l,i)}const save=el('button','primary','설정 저장');save.type='submit';save.style.marginTop='20px';f.append(save);f.addEventListener('submit',async e=>{e.preventDefault();if(!confirm('보관 기간을 줄이면 오래된 완료·취소 기록이 삭제될 수 있어요. 저장할까요?'))return;const d=Object.fromEntries(new FormData(f));try{await api('/api/settings',{maxNumber:+d.maxNumber,retentionDays:+d.retentionDays});notify('저장했어요.');tab='active';await loadTeacher()}catch(e){notify(e.message)}});root.append(f,button('기록 CSV 내려받기','secondary',async()=>{try{const out=await api('/api/visits');const lines=[['접수시각','학년','반','번호','방문 이유','상태'],...out.visits.map(v=>[v.created,v.grade,v.room,v.num,v.symptoms.join(' / '),statusLabel[v.status]])];const csv='\ufeff'+lines.map(row=>row.map(x=>'\"'+String(x).replaceAll('\"','\"\"')+'\"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download='보건실_접수기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){notify(e.message)}}))}
(async()=>{try{session=await api('/api/session');await refreshPublic();if(teacherPage){if(session.role==='teacher'&&session.unlocked)await loadTeacher();else login()}else renderStudent()}catch(e){root.append(errorBox(e))}})();
setInterval(async()=>{if(teacherPage){if(root.querySelector('.toolbar'))await loadTeacher()}else{await refreshPublic();if(!busy&&!completed&&step>0&&Date.now()-lastInput>60000)reset()}},5000);

window.addEventListener("hashchange",()=>location.reload());
</script></body></html>
