const APP_VERSION='20261022.2';
let teacherCounts={waiting:0,treating:0},historyPage=0,historyTotal=0,loadTicket=0,teacherLoading=0,pollFailures=0,pollTimer=null,searchTimer=null,exporting=false,authEpoch=0,reauthNeeded=false;
const pendingVisits=new Set();

function lockTeacher(){
 authEpoch++;loadTicket++;apiToken='';session=null;reauthNeeded=true;visits=[];undo=null;settings={};teacherCounts={waiting:0,treating:0};sessionStorage.removeItem('ongi-token');document.querySelectorAll('dialog').forEach(x=>x.remove());root.replaceChildren();login();connection.textContent='● 로그인 필요';document.getElementById('toast').style.display='none';
}

function reloadLatest(){const u=new URL(location.href);u.searchParams.set('_refresh',Date.now().toString());location.replace(u.href)}
async function queryHistory(resetPage=true){if(resetPage)historyPage=0;await loadTeacher()}

let apiToken='';sessionStorage.removeItem('ongi-token');
async function api(path,data){
 const op=path.split('/').pop();
 if(op==='session'&&apiToken&&session)return session;
 if(idleExpired()&&op!=='session')throw new Error('로그인이 만료됐어요.');
 if(op==='session'&&reauthNeeded){apiToken='';session=null;reauthNeeded=false}
 const epoch=authEpoch,token=apiToken,controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
 let res,out;
 try{
  res=await fetch('https://kzbkuapvtahtzibcqiwp.supabase.co/functions/v1/kiosk-api',{method:'POST',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json','x-kiosk-session':token},body:JSON.stringify({op,payload:data||{}})});
  out=await res.json();
 }finally{clearTimeout(timeout)}
 if(epoch!==authEpoch)throw new Error('로그인이 만료됐어요.');
 if(!res.ok){
  if(res.status===401){if(teacherPage)lockTeacher();else{apiToken='';session=null;reauthNeeded=true;}}
  const e=new Error(out.error||'연결을 확인해 주세요.');e.status=res.status;throw e;
 }
 if(out.token){apiToken=out.token;session=out;}
 if(op==='logout'){authEpoch++;apiToken='';session=null;visits=[];undo=null;}
 return out;
}
async function refreshPublic(){try{if(!apiToken&&!teacherPage)await api('/api/session');config=await api('/api/public');pollFailures=0;connection.textContent='● 연결됨';const w=document.getElementById('count');if(w)w.textContent=config.waiting}catch(e){pollFailures++;connection.textContent='● 연결 끊김';const w=document.getElementById('count');if(w)w.textContent='확인 중'}}
function reset(){chosen={grade:null,room:null,num:null,symptoms:[]};step=0;busy=false;completed=false;requestId=crypto.randomUUID();lastInput=Date.now();renderStudent()}
function errorBox(e){return el('div','error',e.message||e)}
function renderStudent(){root.replaceChildren();const layout=el('div','layout'),aside=el('section'),body=el('section');aside.append(el('div','eyebrow','HEALTH ROOM · CHECK IN'),el('h1','',['몇 학년이에요?','몇 반이에요?','몇 번이에요?','어디가 불편해요?'][step]),el('p','','천천히 눌러 주세요.\n잘못 눌렀다면 돌아갈 수 있어요.'));const steps=el('div','steps');for(let i=0;i<4;i++)steps.append(el('span','step'+(step===i?' on':''),i+1));aside.append(steps);const w=el('div','waiting');w.append(el('span','','지금 기다리는 친구 '));const count=el('strong','',config.waiting??'확인 중');count.id='count';w.append(count,el('span','',' 명'));aside.append(w);const summary=el('div','summary');['grade','room','num'].forEach((k,i)=>{if(chosen[k])summary.append(el('span','pill',chosen[k]+['학년','반','번'][i]))});body.append(summary);const grid=el('div','grid'+(step===2?' numbers':step===3?' symptoms':''));if(step<3){const max=[6,9,config.maxNumber][step];for(let n=1;n<=max;n++){const b=button('','choice',()=>{chosen[['grade','room','num'][step]]=n;if(step===0){chosen.room=null;chosen.num=null}if(step===1)chosen.num=null;step++;renderStudent()});b.append(el('strong','',n),el('small','',['학년','반','번'][step]));grid.append(b)}}else config.symptoms.forEach(s=>{const b=button((chosen.symptoms.includes(s)?'✓  ':'')+s,'choice'+(chosen.symptoms.includes(s)?' selected':''),()=>{chosen.symptoms=chosen.symptoms.includes(s)?chosen.symptoms.filter(x=>x!==s):[...chosen.symptoms,s];renderStudent()});b.setAttribute('aria-pressed',chosen.symptoms.includes(s));grid.append(b)});body.append(grid);const actions=el('div','actions');actions.append(button(step?'← 이전으로':'처음으로','secondary',()=>{if(step)step--;else reset();renderStudent()}));if(step===3){const b=button(busy?'저장 확인 중…':'접수하기 →','primary',submit);b.disabled=busy||!chosen.symptoms.length;actions.append(b)}body.append(actions);layout.append(aside,body);root.append(layout)}
async function submit(){if(busy)return;busy=true;renderStudent();try{const out=await api('/api/checkin',{...chosen,id:requestId});completed=true;chosen={grade:null,room:null,num:null,symptoms:[]};root.replaceChildren();const panel=el('div','success');panel.append(el('div','check','✓'),el('h1','','접수됐어요!'),el('h2','',`지금은 대기 ${out.position}번째예요.`),el('p','','의자에 앉아서 기다려 주세요.\n선생님이 부르면 들어오세요.'),button('처음 화면으로','primary',reset),el('p','','5초 후 첫 화면으로 돌아가요.'));root.append(panel);await refreshPublic();setTimeout(()=>{if(completed)reset()},5000)}catch(e){busy=false;renderStudent();root.prepend(errorBox(e))}}
function login(){root.replaceChildren();visits=[];const box=el('form','login');box.append(el('div','eyebrow','TEACHER ACCESS'),el('h1','','선생님 관리창'),el('p','','관리 비밀번호를 입력해 주세요.'));const fields=[['관리 비밀번호','password','password']];for(const [name,key,type]of fields){const label=el('label','',name),input=el('input');input.name=key;input.id=key;label.htmlFor=key;input.type=type;input.required=true;input.autocomplete=key==='username'?'username':key==='password'?'current-password':'off';if(key==='username')input.value='teacher';if(key==='pin'){input.inputMode='numeric';input.maxLength=4}box.append(label,input)}const submit=el('button','primary','관리창 열기');submit.type='submit';submit.style.marginTop='24px';box.append(submit);box.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;box.querySelector('.error')?.remove();try{const d=Object.fromEntries(new FormData(box));lastInput=Date.now();if(!apiToken)await api('/api/session');await api('/api/login',d);session=await api('/api/session');await loadTeacher()}catch(err){box.append(errorBox(err))}finally{submit.disabled=false}});root.append(box)}
async function loadTeacher(){
 if(idleExpired()||session?.role!=='teacher')return;
 const ticket=++loadTicket,epoch=authEpoch;teacherLoading++;
 const params=tab==='history'?historyPayload():{mode:tab==='settings'?'settings':'active'};
 params.touch=Date.now()-lastInput<15000;
 try{
  const d=await api('/api/visits',params);
  if(ticket!==loadTicket||epoch!==authEpoch||session?.role!=='teacher')return;
  visits=d.visits;settings=d.settings;teacherCounts=d.counts||teacherCounts;historyTotal=d.total||0;pollFailures=0;
  if(tab==='history'&&historyPage>0&&historyPage*50>=historyTotal){historyPage=Math.max(0,Math.ceil(historyTotal/50)-1);await loadTeacher();return}
  connection.textContent='● 연결됨 · '+new Date().toLocaleTimeString('ko-KR');renderTeacher();
 }catch(e){if(epoch!==authEpoch)return;pollFailures++;connection.textContent='● 연결 끊김 · 목록은 마지막 조회 기준';notify(e.message)}
 finally{teacherLoading--}
}
async function change(v,status){
 if(pendingVisits.has(v.id))return;pendingVisits.add(v.id);renderTeacher();
 try{await api('/api/status',{id:v.id,status,version:v.version});if(status==='done'){undo={id:v.id,version:v.version+1,until:Date.now()+10000};notify('완료했어요. 10초간 실행 취소할 수 있어요.')}}
 catch(e){notify(e.message)}finally{pendingVisits.delete(v.id);await loadTeacher()}
}

function editReason(v){
 if(document.querySelector('dialog.reason-editor'))return;
 const dialog=el('dialog','reason-editor'),form=el('form'),title=el('h2','','방문 사유 수정');
 title.id='reason-title';dialog.setAttribute('aria-labelledby',title.id);
 form.append(title,el('p','',v.grade+'학년 '+v.room+'반 '+v.num+'번 · '+statusLabel[v.status]));
 const label=el('label','','사유를 한 줄에 하나씩 입력해 주세요.'),input=el('textarea');
 input.id='reason-input';label.htmlFor=input.id;input.rows=5;input.maxLength=2411;input.value=v.symptoms.join('\n');
 form.append(label,input,el('p','','1~12개, 사유마다 200자까지 입력할 수 있어요. 저장 후 CSV에도 반영돼요.'));
 const actions=el('div','actions'),cancel=button('취소','secondary',()=>dialog.close()),save=el('button','primary','저장');
 save.type='submit';actions.append(cancel,save);form.append(actions);
 form.addEventListener('input',()=>{lastInput=Date.now()});
 form.addEventListener('submit',async e=>{
  e.preventDefault();if(save.disabled)return;
  const symptoms=input.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  form.querySelector('.error')?.remove();
  if(!symptoms.length||symptoms.length>12||symptoms.some(x=>x.length>200)){form.append(errorBox('사유는 1~12개, 각 200자 이내로 입력해 주세요.'));return}
  save.disabled=true;cancel.disabled=true;input.disabled=true;save.textContent='저장 중…';
  try{await api('/api/reason',{id:v.id,version:v.version,symptoms});dialog.close();notify('방문 사유를 수정했어요. 새로 내려받는 CSV에도 반영돼요.');await loadTeacher()}
  catch(e){form.append(errorBox(e));}
  finally{save.disabled=false;cancel.disabled=false;input.disabled=false;save.textContent='저장'}
 });
 dialog.addEventListener('cancel',e=>{if(save.disabled)e.preventDefault()});
 dialog.addEventListener('close',()=>dialog.remove());dialog.append(form);document.body.append(dialog);dialog.showModal();input.focus();
}


const koreaDate=value=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
let recordDate=koreaDate(Date.now()),searchText='',recordStatus='';
function matchedVisits(rows,history=tab==='history'){
 const terms=searchText.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean);
 return rows.filter(v=>{
  if(history&&recordDate&&koreaDate(v.created)!==recordDate)return false;
  if(history&&recordStatus&&v.status!==recordStatus)return false;
  if(!history&&!['waiting','treating'].includes(v.status))return false;
  const text=(v.grade+'학년 '+v.room+'반 '+v.num+'번 '+v.symptoms.join(' ')+' '+statusLabel[v.status]).normalize('NFKC').toLowerCase();
  return terms.every(t=>text.includes(t));
 });
}
async function exportVisits(filtered=false){
 if(exporting)return;exporting=true;
 const epoch=authEpoch,params=filtered?historyPayload({page:0,limit:200}):{mode:'history',date:'',query:'',status:'',page:0,limit:200};
 try{
  const rows=[];let beforeSeq=null;
  do{
   const d=await api('/api/visits',{...params,...(beforeSeq!==null?{beforeSeq}:{}),touch:Date.now()-lastInput<15000});
   if(epoch!==authEpoch||session?.role!=='teacher')throw new Error('로그인이 만료됐어요.');
   rows.push(...d.visits);if(d.visits.length<200)break;
   beforeSeq=d.visits[d.visits.length-1].seq;
  }while(true);
  const lines=[['접수시각','학년','반','번호','방문 이유','상태'],...rows.map(v=>[new Date(v.created).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}),v.grade,v.room,v.num,v.symptoms.join(' / '),statusLabel[v.status]])];
  const csv='\ufeff'+lines.map(row=>row.map(x=>{let t=String(x);if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'}).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download=filtered?'보건실_접수기록_'+(params.date||'전체날짜')+'.csv':'보건실_접수기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){notify(e.message)}finally{exporting=false}
}
function renderRecordFilters(){
 const form=el('form','record-filters');form.addEventListener('submit',e=>e.preventDefault());
 if(tab==='history'){
  const group=el('div'),label=el('label','','접수 날짜'),date=el('input');date.type='date';date.id='record-date';date.value=recordDate;label.htmlFor=date.id;
  date.addEventListener('change',()=>{recordDate=date.value;queryHistory()});group.append(label,date);form.append(group);
  form.append(button('오늘','secondary',()=>{recordDate=koreaDate(Date.now());queryHistory()}),button('전체 날짜','secondary',()=>{recordDate='';queryHistory()}));
  const group2=el('div'),label2=el('label','','처리 상태'),select=el('select');select.id='record-status';label2.htmlFor=select.id;
  for(const [value,name]of[['','전체 상태'],...Object.entries(statusLabel)]){const opt=el('option','',name);opt.value=value;opt.selected=value===recordStatus;select.append(opt)}
  select.addEventListener('change',()=>{recordStatus=select.value;queryHistory()});group2.append(label2,select);form.append(group2);
 }

function renderTeacher(){if(document.querySelector('dialog.reason-editor'))return;if(tab==='settings'&&root.querySelector('form.settings'))return;const focused=document.activeElement,focusId=focused?.id,start=focused?.selectionStart,end=focused?.selectionEnd;root.replaceChildren();const tools=el('div','toolbar');tools.append(el('h1','','보건실 접수 관리'),button('목록 새로고침','secondary',loadTeacher),button('새 버전 불러오기','secondary',reloadLatest),el('small','',APP_VERSION),button('로그아웃','secondary',async()=>{await api('/api/logout',{});session=await api('/api/session');login()}));root.append(tools);if(settings.retention_days==='0')root.append(el('div','notice','시제품 · 보관 기간이 아직 설정되지 않았어요. 실제 학생 정보는 입력하지 마세요.'));const stats=el('div','stats');for(const [s,name]of[['waiting','대기'],['treating','진료중']]){const n=el('div','stat',name);n.append(el('strong','',teacherCounts[s]||0));stats.append(n)}root.append(stats);const tabs=el('div','tabs');[['active','현재 접수'],['history','날짜별 접수 내역'],['settings','운영 설정']].forEach(([key,name])=>tabs.append(button(name,'tab'+(tab===key?' active':''),()=>{clearTimeout(searchTimer);tab=key;historyPage=0;visits=[];root.replaceChildren();loadTeacher()})));root.append(tabs);if(undo&&undo.until>Date.now())root.append(button('↶ 방금 완료한 접수 되돌리기','secondary',async()=>{const u=undo;undo=null;await change(u,'treating')}));if(tab==='settings'){renderSettings();return}renderRecordFilters();const matched=tab==='history'?visits:matchedVisits(visits),filtered=tab==='active'?[...matched.filter(v=>v.status==='treating'),...matched.filter(v=>v.status==='waiting')]:matched.slice().sort((a,b)=>new Date(b.created)-new Date(a.created));root.append(el('p','result-count',(tab==='history'?(recordDate||'전체 날짜')+' · ':'')+'검색 결과 '+(tab==='history'?historyTotal:filtered.length)+'건'));let lastDate='';if(!filtered.length)root.append(el('div','empty','조건에 맞는 접수 내역이 없어요.'));if(tab==='history'){const nav=el('div','actions'),prev=button('이전 50건','secondary',()=>{historyPage--;queryHistory(false)}),next=button('다음 50건','secondary',()=>{historyPage++;queryHistory(false)});prev.disabled=historyPage===0;next.disabled=(historyPage+1)*50>=historyTotal;nav.append(prev,el('span','',historyTotal?((historyPage*50+1)+'–'+Math.min((historyPage+1)*50,historyTotal)+' / '+historyTotal):'0건'),next);root.append(nav)}for(const v of filtered){if(tab==='history'&&koreaDate(v.created)!==lastDate){lastDate=koreaDate(v.created);root.append(el('h2','date-heading',lastDate))}const card=el('article','card');card.append(el('div','position',tab==='active'&&v.status==='waiting'?v.position:'＋'));const details=el('div','details');details.append(el('h3','',`${v.grade}학년 ${v.room}반 ${v.num}번`),el('p','',v.symptoms.join(' · ')),el('p','',`${statusLabel[v.status]} · ${new Date(v.created).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}`));card.append(details);const a=el('div','card-actions');a.append(button('사유 수정','secondary',()=>editReason(v)));if(v.status==='waiting'){a.append(button('진료 시작','primary',()=>change(v,'treating')),button('접수 취소','danger',()=>{if(confirm('이 접수를 취소할까요? 기록은 취소 내역에 남아요.'))change(v,'cancelled')}))}else if(v.status==='treating'){a.append(button('완료 ✓','primary',()=>change(v,'done')),button('대기로','secondary',()=>change(v,'waiting')))}else a.append(button('대기로 복원','secondary',()=>{if(confirm('원래 접수순서로 복원할까요?'))change(v,'waiting')}));const del=button(deletingVisits.has(v.id)?'삭제 중…':'기록 삭제','danger',()=>deleteVisit(v));del.disabled=deletingVisits.has(v.id);a.append(del);if(pendingVisits.has(v.id)||deletingVisits.has(v.id))a.querySelectorAll('button').forEach(b=>b.disabled=true);card.append(a);root.append(card)}if(focusId){const input=document.getElementById(focusId);if(input){input.focus();if(input.type==='search'&&start!==null)input.setSelectionRange(start,end)}}}
function renderSettings(){const f=el('form','settings');f.append(el('h2','','운영 설정'),el('p','','번호 범위는 현재 전체 학급 공통이에요.\n보관 기간 0일은 자동 삭제 미설정 상태입니다.'));for(const [key,label,value,min,max]of[['maxNumber','학생 번호 최대값',settings.max_number,1,60],['retentionDays','완료·취소 기록 보관 일수',settings.retention_days,0,3650]]){const l=el('label','',label),i=el('input');i.name=key;i.type='number';i.min=min;i.max=max;i.value=value;i.required=true;f.append(l,i)}const save=el('button','primary','설정 저장');save.type='submit';save.style.marginTop='20px';f.append(save);f.addEventListener('submit',async e=>{e.preventDefault();if(!confirm('보관 기간을 줄이면 오래된 완료·취소 기록이 삭제될 수 있어요. 저장할까요?'))return;const d=Object.fromEntries(new FormData(f));try{await api('/api/settings',{maxNumber:+d.maxNumber,retentionDays:+d.retentionDays});notify('저장했어요.');tab='active';await loadTeacher()}catch(e){notify(e.message)}});root.append(f,button('전체 기록 CSV 내려받기','secondary',()=>exportVisits(false)))}

  if(teacherPage){if(session?.role==='teacher'&&tab==='active'&&!teacherLoading&&!document.querySelector('dialog')&&!pendingVisits.size&&!deletingVisits.size)await loadTeacher()}

}
